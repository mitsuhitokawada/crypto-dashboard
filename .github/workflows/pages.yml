name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/monthly-data-dashboard-lEf1R"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/monthly-data-dashboard-lEf1R

      - name: Enable GitHub Pages via API
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"claude/monthly-data-dashboard-lEf1R","path":"/"}}' \
            || echo "Pages already enabled or needs activation from UI"
          sleep 5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Published at https://${{ github.repository_owner }}.github.io/crypto-dashboard/"
